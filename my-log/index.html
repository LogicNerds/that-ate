<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>my log · that ate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  .mylog-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 1.75rem;
    display: flex; align-items: flex-end;
    justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  .mylog-title {
    font-size: 1.75rem; font-weight: 600; color: var(--text);
    margin-bottom: 0.15rem; letter-spacing: -0.02em;
  }
  .mylog-sub { color: var(--muted); font-size: 0.88rem; }
  .mylog-body { max-width: 720px; margin: 0 auto; padding: 2rem 1.75rem; }
  .mylog-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .mylog-entry {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 1rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.2rem;
    text-decoration: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .mylog-entry:hover {
    border-color: var(--indigo);
    box-shadow: 0 2px 8px rgba(67,56,202,0.08);
  }
  .mylog-entry-left { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
  .mylog-restaurant { font-size: 0.97rem; font-weight: 600; color: var(--text); }
  .mylog-dish { font-size: 0.85rem; font-weight: 500; color: var(--muted); }
  .mylog-note {
    font-size: 0.8rem; color: #9ca3af;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 360px;
  }
  .mylog-entry-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; flex-shrink: 0; }
  .mylog-date { font-size: 0.76rem; color: #9ca3af; }

  @media (max-width: 600px) { .mylog-note { max-width: 180px; } }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand">
    <img src="/that-ate-assets/that-ate-logo.png" alt="that ate" height="28">
  </a>
  <div class="nav-links">
    <a href="/"            class="nav-link">explore</a>
    <a href="/log-a-visit" class="nav-link">log a visit</a>
    <a href="/my-log"      class="nav-link active">my log</a>
  </div>
  <!-- TODO: replace with real auth button once auth is wired -->
  <div class="nav-user">you</div>
</nav>

<div class="mylog-header">
  <div>
    <h1 class="mylog-title">my log</h1>
    <!-- TODO: replace "everything you've" with "{user.displayName}'s log" once auth is wired -->
    <p class="mylog-sub">everything you've eaten and logged.</p>
  </div>
  <a href="/log-a-visit" class="btn-primary">+ log a visit</a>
</div>

<div class="mylog-body">
  <p class="status" id="mylog-loading">loading…</p>
  <div class="mylog-list" id="mylog-list"></div>
  <div class="empty" id="mylog-empty" style="display:none">
    <p>your log is empty.</p>
    <a href="/log-a-visit" class="empty-cta">log your first visit →</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { injectBaseStyles, bitesHTML, formatDate, esc } from "../js/ui.js";
  import { getReviewsForUser }                             from "../js/firestore.js";
  import { CURRENT_USER }                                  from "../js/auth.js";

  injectBaseStyles();

  const list    = document.getElementById("mylog-list");
  const empty   = document.getElementById("mylog-empty");
  const loading = document.getElementById("mylog-loading");

  // TODO: replace CURRENT_USER.uid with real auth user uid once auth is wired
  getReviewsForUser(CURRENT_USER.uid).then(reviews => {
    loading.style.display = "none";

    if (reviews.length === 0) { empty.style.display = "block"; return; }

    reviews.forEach(rev => {
      const a = document.createElement("a");
      a.className = "mylog-entry";
      a.href      = `/restaurant?id=${rev.restaurantId}`;
      a.innerHTML = `
        <div class="mylog-entry-left">
          <span class="mylog-restaurant">${esc(rev.restaurantName)}</span>
          <span class="mylog-dish">${esc(rev.dish)}</span>
          ${rev.comment ? `<span class="mylog-note">${esc(rev.comment)}</span>` : ""}
        </div>
        <div class="mylog-entry-right">
          ${bitesHTML(rev.rating, "sm")}
          <span class="mylog-date">${formatDate(rev.createdAt)}</span>
        </div>`;
      list.appendChild(a);
    });
  });
</script>
</body>
</html>
